    why_now: "На прошлой неделе в этот день была развивающая (4 × 3 км в T21), теперь — 5 × 1,2 км в T5. В развивающей фазе поднимаем порог и МПК — основу марафонской скорости. Через неделю: 4 × 1,6 км в T10-5."

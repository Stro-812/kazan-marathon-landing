    why_now: "На прошлой неделе в этот день была интервальная (6 × 1 км в T5), теперь — 2 × 5 км в T21. В развивающей фазе поднимаем порог и МПК — основу марафонской скорости. Через неделю: 3 × 4 км в T21."

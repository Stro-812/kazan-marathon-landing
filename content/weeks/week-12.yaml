    type: "длительная"
    warmup_km: 0
    sets:
      - reps: 1
        rep_km: 22
        pace: "T42+30"
        recovery_km: 0
    cooldown_km: 0
    why: "Длительный бег в лёгком темпе развивает выносливость: растёт сеть капилляров, мышцы экономнее расходуют гликоген. Связки и суставы привыкают к нагрузке в несколько часов."
    why_now: "На прошлой неделе было 28 км в T42+30, сейчас 22 км в T42+30. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 30 км в T42+25."

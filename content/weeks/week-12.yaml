# ЧЕРНОВИК — сверить с планом в S10.run. После сверки удалить строку draft: true.
week: 12
phase: "развивающая"
draft: true
easy_km: 21            # лёгкие пробежки недели, км
workouts:
  - day: "вт"
    type: "интервальная"
    warmup_km: 3
    sets:
      - reps: 6

    why: "Отрезки в темпе 5 км развивают МПК — максимальную способность организма потреблять кислород. Чем выше этот потолок, тем легче даётся марафонский темп."
    why_now: "На прошлой неделе было 4 × 1,6 км в T10-5, сейчас 6 × 1 км в T5. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 5 × 2 км в T10."
  - day: "чт"
    type: "развивающая"
    warmup_km: 3
    sets:
      - reps: 2
        rep_km: 4
        pace: "T21"
        recovery_km: 1
    cooldown_km: 2
    why: "Работа около темпа полумарафона поднимает анаэробный порог — скорость, которую можно держать долго без накопления лактата. Для марафонца это главный показатель."
    why_now: "На прошлой неделе было 3 × 4 км в T21, сейчас 2 × 4 км в T21. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 10 км в T21+5."

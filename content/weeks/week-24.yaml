# ЧЕРНОВИК — сверить с планом в S10.run. После сверки удалить строку draft: true.
week: 24
phase: "подводка"
draft: true
easy_km: 12            # лёгкие пробежки недели, км
workouts:
  - day: "вт"
    type: "интервальная"
    warmup_km: 2
    sets:
      - reps: 4
        rep_km: 1
        pace: "T10"
        recovery_km: 0.4
    cooldown_km: 2
    why: "Отрезки в темпе 10 км поднимают аэробную мощность и учат держать высокий темп на фоне усталости. Это мост между скоростью и выносливостью."
    why_now: "На прошлой неделе было 6 × 1 км в T10, сейчас 4 × 1 км в T10. Подводка: объём снижается, интенсивность остаётся, чтобы выйти на старт свежим."
  - day: "чт"
    type: "развивающая"
    warmup_km: 2
    sets:
      - reps: 2
        rep_km: 2
        pace: "T42"
        recovery_km: 1
    cooldown_km: 1
    why: "Отрезки в марафонском темпе приучают тело к целевой скорости: экономичный шаг, ровное дыхание, питьё на ходу."
    why_now: "На прошлой неделе было 8 км в T42, сейчас 2 × 2 км в T42. Подводка: объём снижается, интенсивность остаётся, чтобы выйти на старт свежим."
  - day: "вс"
    type: "соревнование"
    warmup_km: 0
    sets:
      - reps: 1
        rep_km: 42.2
        pace: "T42"
        recovery_km: 0
    cooldown_km: 0
    why: "Главный старт. Ровный темп T42 с первых километров, питание по плану; ускоряться — только после 35-го километра, если остались силы."
    why_now: "Неделя старта: все объёмы позади, остаются короткие поддерживающие работы во вторник и четверг. Задача — прийти на старт отдохнувшим."

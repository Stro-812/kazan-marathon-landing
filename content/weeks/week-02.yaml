# ЧЕРНОВИК — сверить с планом в S10.run. После сверки удалить строку draft: true.
week: 2
phase: "базовая"
draft: true
easy_km: 24            # лёгкие пробежки недели, км
workouts:
  - day: "вт"
    type: "повторная"
    warmup_km: 2
    sets:
      - reps: 12
        rep_km: 0.2
        pace: "T5-5"
        recovery_km: 0.2
    cooldown_km: 2
    why: "Короткие быстрые отрезки ставят технику и частоту шага: ноги учатся бежать быстро без закисления. Полное восстановление между повторами сохраняет качество каждого отрезка."
    why_now: "На прошлой неделе было 10 × 0,2 км в T5-5, сейчас 12 × 0,2 км в T5-5. В базовой фазе строим аэробный фундамент и привычку к регулярной работе. Через неделю: 8 × 0,4 км в T5."
  - day: "чт"
    type: "развивающая"
    warmup_km: 2
    sets:
      - reps: 2
        rep_km: 3
        pace: "T21+15"
        recovery_km: 1
    cooldown_km: 2
    why: "Работа около темпа полумарафона поднимает анаэробный порог — скорость, которую можно держать долго без накопления лактата. Для марафонца это главный показатель."
    why_now: "На прошлой неделе было 4 км в T21+15, сейчас 2 × 3 км в T21+15. В базовой фазе строим аэробный фундамент и привычку к регулярной работе. Через неделю: 6 км в T21+10."
  - day: "вс"
    type: "длительная"
    warmup_km: 0
    sets:
      - reps: 1
        rep_km: 18
        pace: "T42+45"
        recovery_km: 0
    cooldown_km: 0
    why: "Длительный бег в лёгком темпе развивает выносливость: растёт сеть капилляров, мышцы экономнее расходуют гликоген. Связки и суставы привыкают к нагрузке в несколько часов."
    why_now: "На прошлой неделе было 16 км в T42+45, сейчас 18 км в T42+45. В базовой фазе строим аэробный фундамент и привычку к регулярной работе. Через неделю: 19 км в T42+40."

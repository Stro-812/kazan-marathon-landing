# ЧЕРНОВИК — сверить с планом в S10.run. После сверки удалить строку draft: true.
week: 3
phase: "базовая"
draft: true
easy_km: 25            # лёгкие пробежки недели, км
workouts:
  - day: "вт"
    type: "повторная"
    warmup_km: 2
    sets:
      - reps: 8
        rep_km: 0.4
        pace: "T5"
        recovery_km: 0.4
    cooldown_km: 2
    why: "Короткие быстрые отрезки ставят технику и частоту шага: ноги учатся бежать быстро без закисления. Полное восстановление между повторами сохраняет качество каждого отрезка."
    why_now: "На прошлой неделе было 12 × 0,2 км в T5-5, сейчас 8 × 0,4 км в T5. В базовой фазе строим аэробный фундамент и привычку к регулярной работе. Через неделю: 8 × 0,2 км в T5-5."
  - day: "чт"
    type: "развивающая"
    warmup_km: 2
    sets:
      - reps: 1
        rep_km: 6
        pace: "T21+10"
        recovery_km: 0
    cooldown_km: 2
    why: "Работа около темпа полумарафона поднимает анаэробный порог — скорость, которую можно держать долго без накопления лактата. Для марафонца это главный показатель."
    why_now: "На прошлой неделе было 2 × 3 км в T21+15, сейчас 6 км в T21+10. В базовой фазе строим аэробный фундамент и привычку к регулярной работе. Через неделю: 4 км в T21+15."
  - day: "вс"
    type: "длительная"
    warmup_km: 0
    sets:
      - reps: 1
        rep_km: 19
        pace: "T42+40"
        recovery_km: 0
    cooldown_km: 0
    why: "Длительный бег в лёгком темпе развивает выносливость: растёт сеть капилляров, мышцы экономнее расходуют гликоген. Связки и суставы привыкают к нагрузке в несколько часов."
    why_now: "На прошлой неделе было 18 км в T42+45, сейчас 19 км в T42+40. В базовой фазе строим аэробный фундамент и привычку к регулярной работе. Через неделю: 15 км в T42+45."

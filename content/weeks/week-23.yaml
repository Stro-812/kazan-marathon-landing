    why: "Отрезки в темпе 10 км поднимают аэробную мощность и учат держать высокий темп на фоне усталости. Это мост между скоростью и выносливостью."
    why_now: "На прошлой неделе было 5 × 1,6 км в T10, сейчас 6 × 1 км в T10. Подводка: объём снижается, интенсивность остаётся, чтобы выйти на старт свежим. Через неделю: 4 × 1 км в T10."
  - day: "чт"
    type: "развивающая"
    warmup_km: 3
    sets:
      - reps: 1
        rep_km: 8
        pace: "T42"
        recovery_km: 0
    cooldown_km: 2
    why: "Отрезки в марафонском темпе приучают тело к целевой скорости: экономичный шаг, ровное дыхание, питьё на ходу."
    why_now: "На прошлой неделе было 2 × 5 км в T42, сейчас 8 км в T42. Подводка: объём снижается, интенсивность остаётся, чтобы выйти на старт свежим. Через неделю: 2 × 2 км в T42."

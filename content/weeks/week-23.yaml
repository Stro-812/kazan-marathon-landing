# ЧЕРНОВИК — сверить с планом в S10.run. После сверки удалить строку draft: true.
week: 23
phase: "подводка"
draft: true
easy_km: 20            # лёгкие пробежки недели, км
workouts:
  - day: "вт"
    type: "интервальная"
    warmup_km: 3
    sets:
      - reps: 6
        rep_km: 1

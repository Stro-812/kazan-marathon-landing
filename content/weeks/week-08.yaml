    why: "Отрезки в темпе 5 км развивают МПК — максимальную способность организма потреблять кислород. Чем выше этот потолок, тем легче даётся марафонский темп."
    why_now: "На прошлой неделе было 6 × 1 км в T5, сейчас 5 × 1 км в T5. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 4 × 3 км в T21."

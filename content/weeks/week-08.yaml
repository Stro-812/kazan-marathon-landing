    warmup_km: 0
    sets:
      - reps: 1
        rep_km: 18
        pace: "T42+35"
        recovery_km: 0
    cooldown_km: 0
    why: "Длительный бег в лёгком темпе развивает выносливость: растёт сеть капилляров, мышцы экономнее расходуют гликоген. Связки и суставы привыкают к нагрузке в несколько часов."
    why_now: "На прошлой неделе было 23 км в T42+35, сейчас 18 км в T42+35. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 26 км в T42+30."

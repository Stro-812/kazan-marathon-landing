    type: "развивающая"
    warmup_km: 3
    sets:
      - reps: 2
        rep_km: 3
        pace: "T21"
        recovery_km: 1
    cooldown_km: 2
    why: "Работа около темпа полумарафона поднимает анаэробный порог — скорость, которую можно держать долго без накопления лактата. Для марафонца это главный показатель."
    why_now: "На прошлой неделе было 3 × 3 км в T21, сейчас 2 × 3 км в T21. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 6 × 1 км в T5."

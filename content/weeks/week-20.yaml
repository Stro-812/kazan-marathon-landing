# ЧЕРНОВИК — сверить с планом в S10.run. После сверки удалить строку draft: true.
week: 20
phase: "специальная"
draft: true
easy_km: 28            # лёгкие пробежки недели, км
workouts:
  - day: "вт"
    type: "интервальная"
    warmup_km: 3
    sets:
      - reps: 8
        rep_km: 1
        pace: "T10-5"
        recovery_km: 0.4
    cooldown_km: 2
    why: "Отрезки в темпе 10 км поднимают аэробную мощность и учат держать высокий темп на фоне усталости. Это мост между скоростью и выносливостью."
    why_now: "На прошлой неделе было 6 × 1,6 км в T10, сейчас 8 × 1 км в T10-5. В специальной фазе работа смещается к марафонскому темпу. Через неделю: 5 × 2 км в T10."
  - day: "чт"
    type: "развивающая"
    warmup_km: 3
    sets:
      - reps: 3
        rep_km: 6
        pace: "T42"
        recovery_km: 1
    cooldown_km: 2
    why: "Отрезки в марафонском темпе приучают тело к целевой скорости: экономичный шаг, ровное дыхание, питьё на ходу."
    why_now: "На прошлой неделе было 12 км в T42, сейчас 3 × 6 км в T42. В специальной фазе работа смещается к марафонскому темпу. Через неделю: 2 × 6 км в T42."
  - day: "вс"
    type: "длительная"
    warmup_km: 0
    sets:
      - reps: 1
        rep_km: 21
        pace: "T42+30"
        recovery_km: 0
      - reps: 1
        rep_km: 12
        pace: "T42"
        recovery_km: 0
    cooldown_km: 0
    why: "Длительная с финишем в марафонском темпе учит держать целевую скорость на усталых ногах, как на последних километрах старта. Заодно отрабатывается питание на дистанции."
    why_now: "На прошлой неделе было 18 км в T42+30 и 12 км в T42, сейчас 21 км в T42+30 и 12 км в T42. В специальной фазе работа смещается к марафонскому темпу. Через неделю: 18 км в T42+30 и 10 км в T42."

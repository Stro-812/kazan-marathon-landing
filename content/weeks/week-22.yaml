    why_now: "На прошлой неделе было 18 км в T42+30 и 10 км в T42, сейчас 16 км в T42+30 и 8 км в T42. Подводка: объём снижается, интенсивность остаётся, чтобы выйти на старт свежим. Через неделю: 18 км в T42+30."

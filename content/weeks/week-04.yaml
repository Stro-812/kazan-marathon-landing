# ЧЕРНОВИК — сверить с планом в S10.run. После сверки удалить строку draft: true.
week: 4
phase: "базовая"
draft: true
easy_km: 20            # лёгкие пробежки недели, км
workouts:
  - day: "вт"
    type: "повторная"
    warmup_km: 2
    sets:
      - reps: 8
        rep_km: 0.2
        pace: "T5-5"
        recovery_km: 0.2
    cooldown_km: 2
    why: "Короткие быстрые отрезки ставят технику и частоту шага: ноги учатся бежать быстро без закисления. Полное восстановление между повторами сохраняет качество каждого отрезка."
    why_now: "На прошлой неделе было 8 × 0,4 км в T5, сейчас 8 × 0,2 км в T5-5. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 10 × 0,4 км в T5."
  - day: "чт"
    type: "развивающая"
    warmup_km: 2
    sets:
      - reps: 1
        rep_km: 4
        pace: "T21+15"
        recovery_km: 0
    cooldown_km: 2
    why: "Работа около темпа полумарафона поднимает анаэробный порог — скорость, которую можно держать долго без накопления лактата. Для марафонца это главный показатель."
    why_now: "На прошлой неделе было 6 км в T21+10, сейчас 4 км в T21+15. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 2 × 4 км в T21+10."
  - day: "вс"
    type: "длительная"
    warmup_km: 0
    sets:
      - reps: 1
        rep_km: 15
        pace: "T42+45"
        recovery_km: 0
    cooldown_km: 0
    why: "Длительный бег в лёгком темпе развивает выносливость: растёт сеть капилляров, мышцы экономнее расходуют гликоген. Связки и суставы привыкают к нагрузке в несколько часов."
    why_now: "На прошлой неделе было 19 км в T42+40, сейчас 15 км в T42+45. Разгрузочная неделя: объём ниже, организм усваивает работу трёх прошлых недель. Через неделю: 21 км в T42+40."

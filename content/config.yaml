# Конфиг марафона. Все даты на сайте считаются от race_date.
# Под другой марафон меняются этот файл и файлы в content/weeks, вёрстка не трогается.

race_name: "Казанский марафон"
race_name_dative: "Казанскому марафону"        # «подготовка к …»
race_name_prepositional: "Казанском марафоне"  # «рекорды на …»
race_city: "Казань"
race_date: "2027-05-02"        # временная дата, официальной пока нет; поменяется одной строкой
timezone: "Europe/Moscow"
plan_weeks: 24                  # неделя 24 содержит день старта

# ЗАПОЛНИТЬ: настоящие ссылки (сейчас заглушки из ТЗ)
s10_buy_url: "https://s10.run/..."     # ссылка на покупку плана в S10.run
telegram_url: "https://t.me/..."       # Телеграм
s10_offer_url: "https://s10.run/..."   # оферта на S10.run
s10_privacy_url: "https://s10.run/..." # политика конфиденциальности на S10.run

# UTM по умолчанию, если посетитель пришёл без своих utm_*
utm_default:
  utm_source: "landing"
  utm_campaign: "kazan2027"

# Яндекс Метрика: номер счётчика. Пусто — счётчик не подключается, цели пишутся в консоль в режиме разработки.
metrika_id: ""

# Адрес сайта (для canonical и абсолютной ссылки на картинку превью). Пусто — без canonical.
site_url: ""

# SEO: заголовок вкладки и описание
title: "Подготовка к Казанскому марафону 2027 — план Юрия Строфилова на S10.run"
description: "Авторский план на марафон с индивидуальными темпами: 24 недели до старта в Казани, на 3 часа, 4 часа и медленнее. Живые тренеры и Телеграм-бот S10.run."

# Фото куратора. Пусто — вместо фото показываются инициалы. Положить файл в public/img и указать путь, например "/img/strofilov.jpg"
curator_photo: "/img/strofilov-800.webp"

price_ladder:                   # цена действует с даты from (понедельник, 00:00 МСК)
  - { from: "2026-11-16", price: 2000 }
  - { from: "2026-11-23", price: 2125 }
  - { from: "2026-11-30", price: 2250 }
  - { from: "2026-12-07", price: 2375 }
  - { from: "2026-12-14", price: 2500 }
  - { from: "2026-12-21", price: 2625 }
  - { from: "2026-12-28", price: 2750 }
  - { from: "2027-01-04", price: 2875 }
  - { from: "2027-01-11", price: 3000 }   # финальная цена, до старта не меняется
currency: "₽"
